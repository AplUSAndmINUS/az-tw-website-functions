name: Deploy DotNet project to Azure Function App

on:
    push:
        branches: ["develop", "test", "master"]

env:
    AZURE_FUNCTIONAPP_NAME: az-tw-website-${{ github.ref_name == 'master' && 'production' || github.ref_name }}
    AZURE_FUNCTIONAPP_PACKAGE_PATH: "./output"
    StorageAccountName: ${{ secrets.StorageAccountName }}
    X_API_ENVIRONMENT_KEY: ${{ secrets.X_API_ENVIRONMENT_KEY }}
    USE_MOCK_STORAGE: ${{ vars.USE_MOCK_STORAGE }}
    DOTNET_VERSION: "8.0.x"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name }}
        steps:
            # Print out the environment we're deploying to'
            - name: Print Deployment Target
              run: 'echo "🔁 Deploying to environment: ${{ github.ref_name }}"'

            - name: "Checkout GitHub Action"
              uses: actions/checkout@v4

            # Using Azure Credentials RBAC
            - name: "Login via Azure CLI"
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: "Inject Function App Settings"
              env:
                  USE_MOCK_STORAGE: "${{ env.USE_MOCK_STORAGE != '' && env.USE_MOCK_STORAGE || 'false' }}"
              run: |
                  if [ "${{ github.ref_name }}" = "master" ]; then
                    echo "🔒 Production build: omitting FUNCTIONS_WORKER_RUNTIME"
                    az functionapp config appsettings set \
                      --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
                      --resource-group az-tw-website-functions \
                      --settings X_API_ENVIRONMENT_KEY="${{ env.X_API_ENVIRONMENT_KEY }}" \
                                  USE_MOCK_STORAGE="${USE_MOCK_STORAGE}" \
                                  StorageAccountName="${{ env.StorageAccountName }}" \
                                  MEDIA_DOCUMENTS_CONTAINER_NAME="documents"
                  else
                    echo "✅ Non-prod build: configuring for isolated worker process"
                    az functionapp config appsettings set \
                      --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
                      --resource-group az-tw-website-functions \
                      --settings X_API_ENVIRONMENT_KEY="${{ env.X_API_ENVIRONMENT_KEY }}" \
                                  USE_MOCK_STORAGE="${USE_MOCK_STORAGE}" \
                                  StorageAccountName="${{ env.StorageAccountName }}" \
                                  MEDIA_DOCUMENTS_CONTAINER_NAME="documents" \
                                  FUNCTIONS_EXTENSION_VERSION=~4 \
                                  AzureWebJobsDisableHomepage=true \
                                  WEBSITE_MOUNT_ENABLED=1 \
                                  WEBSITE_RUN_FROM_PACKAGE=1 \
                                  WEBSITE_USE_PLACEHOLDER_DOTNETISOLATED=1
                  fi

            - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: "Build the Function App"
              run: dotnet publish ./src/Functions/Functions.csproj --configuration Release --output ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

            - name: Generate robots.txt for mock environments
              if: env.USE_MOCK_STORAGE == 'true'
              run: |
                  # Create a robots.txt file to disallow all web crawlers
                  echo "Generating robots.txt for mock environment"
                  echo -e "User-agent: *\nDisallow: /" > ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/robots.txt

            - name: "Optimize package for consumption plan"
              if: github.ref_name != 'master'
              run: |
                  # Create an optimized host.json that works with consumption plans while preserving essential configurations
                  cat > ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/host.json << EOF
                  {
                      "version": "2.0",
                      "logging": {
                          "applicationInsights": {
                              "samplingSettings": {
                                  "isEnabled": true,
                                  "excludedTypes": "Request"
                              }
                          },
                          "logLevel": {
                              "default": "Information",
                              "Function": "Information",
                              "Host.Results": "Information",
                              "Host.Aggregator": "Information"
                          }
                      },
                      "extensions": {
                          "http": {
                              "routePrefix": ""
                          }
                      },
                      "functionTimeout": "00:05:00",
                      "retry": {
                          "strategy": "fixedDelay",
                          "maxRetryCount": 2,
                          "delayInterval": "00:00:03"
                      }
                  }
                  EOF

            - name: List and validate output package contents
              run: |
                  echo "Showing contents of output folder..."
                  find ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

                  echo "Checking for critical files..."
                  if [ ! -f "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/host.json" ]; then
                    echo "⚠️ WARNING: host.json missing from package!"
                  else
                    echo "✅ host.json found in package"
                  fi

                  if [ ! -f "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/Functions.dll" ]; then
                    echo "⚠️ WARNING: Functions.dll missing from package!"
                  else
                    echo "✅ Functions.dll found in package"
                  fi

                  # Print host.json content for validation
                  if [ -f "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/host.json" ]; then
                    echo "host.json content:"
                    cat ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/host.json
                  fi

            - name: "Create deployment zip package"
              run: |
                  cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
                  zip -r ../deploy-package.zip .

            - name: "Get Function App details for debugging"
              run: |
                  echo "📝 Getting Function App details for debugging..."
                  az functionapp show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions

                  echo "📝 Getting Function App settings..."
                  az functionapp config appsettings list --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions

            - name: "Run Azure Functions Action"
              uses: Azure/functions-action@v1
              id: fa
              with:
                  app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
                  package: "deploy-package.zip"
                  enable-oryx-build: false
                  respect-funcignore: true
                  scm-do-build-during-deployment: false
                  remote-build: false

            - name: "Sync Function Triggers"
              run: |
                  echo "📝 Syncing function triggers..."
                  # Wait a moment for deployment to settle
                  sleep 30
                  
                  # Sync triggers using Azure CLI
                  az functionapp function sync-all --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions || echo "CLI sync failed, trying REST API..."
                  
                  # Alternative sync using REST API if CLI fails
                  az rest --method post --uri "https://management.azure.com/subscriptions/$(az account show --query id -o tsv)/resourceGroups/az-tw-website-functions/providers/Microsoft.Web/sites/${{ env.AZURE_FUNCTIONAPP_NAME }}/syncfunctiontriggers?api-version=2022-03-01" || echo "REST API sync also failed"
                  
                  # Restart function app to ensure triggers are properly loaded
                  echo "📝 Restarting function app to ensure triggers are loaded..."
                  az functionapp restart --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions
                  
                  # Wait for restart to complete
                  sleep 15

            - name: "Validate deployment and debug if needed"
              if: always()
              run: |
                  echo "📝 Deployment result: ${{ steps.fa.outcome }}"
                  
                  # Check if deployment succeeded
                  if [ "${{ steps.fa.outcome }}" = "success" ]; then
                    echo "✅ Deployment succeeded!"
                  else
                    echo "❌ Deployment failed, running diagnostics..."
                  fi

                  echo "📝 Checking function app configuration..."
                  az functionapp config show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions

                  echo "📝 Checking function app settings..."
                  az functionapp config appsettings list --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions

                  echo "📝 Getting Function status..."
                  az functionapp function list --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions || echo "Function list failed"

                  echo "📝 Checking runtime version and platform..."
                  az functionapp config show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions --query 'properties.{runtime:linuxFxVersion,platform:platform,alwaysOn:siteConfig.alwaysOn}' -o table || echo "Runtime check failed"
                  
                  echo "📝 Testing function app health..."
                  HEALTH_URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net"
                  curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" "$HEALTH_URL" || echo "Health check failed"
                  
                  # Only get logs if there were issues
                  if [ "${{ steps.fa.outcome }}" != "success" ]; then
                    echo "📝 Getting Function App logs for troubleshooting..."
                    az webapp log download --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions --log-file app_logs.zip || echo "Log download failed"

                    if [ -f app_logs.zip ]; then
                      unzip -q app_logs.zip || echo "Unzip failed"
                      find . -name "*.log" -type f | xargs tail -n 50 || echo "Log reading failed"
                    fi
                  fi
