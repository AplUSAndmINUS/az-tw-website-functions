name: Deploy DotNet project to Azure Function App

on:
    push:
        branches: ["develop", "test", "master"]

env:
    AZURE_FUNCTIONAPP_NAME: az-tw-website-${{ github.ref_name == 'master' && 'production' || github.ref_name }}
    AZURE_FUNCTIONAPP_PACKAGE_PATH: "./output"
    StorageAccountName: ${{ secrets.StorageAccountName }}
    X_API_ENVIRONMENT_KEY: ${{ secrets.X_API_ENVIRONMENT_KEY }}
    USE_MOCK_STORAGE: ${{ vars.USE_MOCK_STORAGE }}
    DOTNET_VERSION: "8.0.x"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name }}
        steps:
            # Print out the environment we're deploying to'
            - name: Print Deployment Target
              run: 'echo "🔁 Deploying to environment: ${{ github.ref_name }}"'

            - name: "Checkout GitHub Action"
              uses: actions/checkout@v4

            # Using Azure Credentials RBAC, so commented out lines 41-44
            - name: "Login via Azure CLI"
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: "Inject Function App Settings"
              env:
                  USE_MOCK_STORAGE: "${{ env.USE_MOCK_STORAGE != '' && env.USE_MOCK_STORAGE || 'false' }}"
              run: |
                  if [ "${{ github.ref_name }}" = "master" ]; then
                    echo "🔒 Production build: omitting FUNCTIONS_WORKER_RUNTIME"
                    az functionapp config appsettings set \
                      --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
                      --resource-group az-tw-website-functions \
                      --settings X_API_ENVIRONMENT_KEY="${{ env.X_API_ENVIRONMENT_KEY }}" \
                                  USE_MOCK_STORAGE="${USE_MOCK_STORAGE}" \
                                  StorageAccountName="${{ env.StorageAccountName }}" \
                                  MEDIA_DOCUMENTS_CONTAINER_NAME="documents"
                  else
                    echo "✅ Non-prod build: including FUNCTIONS_WORKER_RUNTIME"
                    az functionapp config appsettings set \
                      --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
                      --resource-group az-tw-website-functions \
                      --settings X_API_ENVIRONMENT_KEY="${{ env.X_API_ENVIRONMENT_KEY }}" \
                                  USE_MOCK_STORAGE="${USE_MOCK_STORAGE}" \
                                  StorageAccountName="${{ env.StorageAccountName }}" \
                                  MEDIA_DOCUMENTS_CONTAINER_NAME="documents" \
                                  FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
                  fi

            - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: "Build the Function App"
              run: dotnet publish ./src/Functions/Functions.csproj --configuration Release --output ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

            - name: Generate robots.txt for mock environments
              if: env.USE_MOCK_STORAGE == 'true'
              run: |
                  # Create a robots.txt file to disallow all web crawlers
                  echo "Generating robots.txt for mock environment"
                  echo -e "User-agent: *\nDisallow: /" > ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/robots.txt

            - name: List output package contents
              run: |
                  echo "Showing contents of output folder..."
                  find ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

            - name: "Prepare for deployment"
              if: github.ref_name != 'master'
              run: |
                  # Configure the app to use remote package deployment
                  az functionapp config appsettings set \
                    --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
                    --resource-group az-tw-website-functions \
                    --settings WEBSITE_RUN_FROM_PACKAGE=1 \
                                SCM_DO_BUILD_DURING_DEPLOYMENT=true

            - name: "Create deployment zip package"
              run: |
                  cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
                  zip -r ../deploy-package.zip .

            - name: "Get Function App details for debugging"
              run: |
                  echo "📝 Getting Function App details for debugging..."
                  az functionapp show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions

                  echo "📝 Getting Function App settings..."
                  az functionapp config appsettings list --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions

                  echo "📝 Getting Function App host status..."
                  az functionapp show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions --query hostNameSslStates

                  echo "📝 Getting Function App functions..."
                  az functionapp function list --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions

            - name: "Run Azure Functions Action"
              uses: Azure/functions-action@v1
              id: fa
              with:
                  app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
                  package: "deploy-package.zip"
                  enable-oryx-build: false
                  respect-funcignore: true

            - name: "Debug deployment status"
              if: always()
              run: |
                  echo "📝 Deployment result: ${{ steps.fa.outcome }}"

                  echo "📝 Checking function app configuration..."
                  az functionapp config show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions

                  echo "📝 Manually syncing triggers..."
                  az functionapp function sync --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions || echo "Sync failed but continuing"

                  echo "📝 Getting Function App logs (last 100 lines)..."
                  az webapp log download --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions --log-file app_logs.zip || echo "Log download failed but continuing"

                  if [ -f app_logs.zip ]; then
                    unzip -q app_logs.zip || echo "Unzip failed but continuing"
                    find . -name "*.log" -type f | xargs tail -n 100 || echo "Log reading failed but continuing"
                  fi

                  echo "📝 Getting Kudu logs (deployment logs)..."
                  az functionapp deployment list --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions || echo "Deployment list failed but continuing"

                  echo "📝 Getting Function status..."
                  az functionapp function list --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions || echo "Function list failed but continuing"

                  echo "📝 Checking runtime version..."
                  az functionapp config show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group az-tw-website-functions --query 'properties.linuxFxVersion' -o tsv || echo "Runtime check failed but continuing"
